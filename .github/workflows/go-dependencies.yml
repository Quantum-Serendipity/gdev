name: Go Deps

on:
  push:
    branches:
    - main
    # broken by https://github.com/actions/go-dependency-submission/issues/90
    - "!main"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deps:
    runs-on: ubuntu-24.04
    env:
      GH_ACTIONS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
      with:
        egress-policy: audit
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version-file: 'go.work'
        cache-dependency-path: |
          go.mod
          **/go.mod

    # - name: Submit Dependencies (root)
    #   uses: actions/go-dependency-submission@v2
    #   with:
    #       go-mod-path: go.mod
    - name: Submit Dependencies (gdev)
      # this should get almost everything
      uses: actions/go-dependency-submission@e2170f625f1e00ff60ca2ac4f14056a4e1ad9783 # v2
      with:
          go-mod-path: examples/gdev/go.mod
    # - name: Submit Dependencies (mage)
    #   uses: actions/go-dependency-submission@v2
    #   with:
    #       go-mod-path: magefiles/go.mod
