name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        platform:
          - ubuntu-24.04 # amd64
          - ubuntu-24.04-arm # arm64
    runs-on: ${{ matrix.platform }}
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
      with:
        egress-policy: audit
    - name: Checkout Code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version-file: 'go.work'
        cache-dependency-path: |
          go.mod
          **/go.mod
    - name: Setup Mage
      run: go tool mage -l

    - name: Build
      run: go tool mage -v compile
    - name: Test
      run: go tool mage -v test
  cross-compile:
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
      with:
        egress-policy: audit
    - name: Checkout Code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version-file: 'go.work'
        cache-dependency-path: |
          go.mod
          **/go.mod
    - name: Cross-compile darwin/amd64
      run: GOOS=darwin GOARCH=amd64 go build ./...
    - name: Cross-compile darwin/arm64
      run: GOOS=darwin GOARCH=arm64 go build ./...
    - name: Cross-compile windows/amd64
      run: GOOS=windows GOARCH=amd64 go build ./...
  lint:
    # don't need to run lint per-platform for now
    runs-on: ubuntu-24.04
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
      with:
        egress-policy: audit
    - name: Checkout Code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version-file: 'go.work'
        # include the golangci config in the go cache hash so that we don't
        # collide with build cache, and don't have to add an extra file
        cache-dependency-path: |
          .golangci.yaml
          go.mod
          **/go.mod
    - name: Setup Mage
      run: go tool mage -l

    - name: Check codegen
      run: |
        go generate -x work
        git diff --exit-code

    - name: Golangci-lint
      uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9
      # can use latest release nowadays
    - name: Other Lint
      run: go tool mage -v lint:other
